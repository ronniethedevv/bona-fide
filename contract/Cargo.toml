[package]
name = "bona-fide-contract"
version = "0.1.0"
edition = "2024"
description = "Bona Fide — mandate registry and append-only verdict record for market-maker accountability on NEAR"
license = "Apache-2.0"
repository = "https://github.com/ronniethedevv/bona-fide"

# Reproducible build image, matching the Shade Agent template (NearDeFi/shade-agent-template @ 816b75b).
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.19.0-rust-1.86.0"
image_digest = "sha256:772638e343baeeea24e49062c7d424274f3441452cc06ce97fc4e5695b19fecc"
container_build_command = [
    "cargo",
    "near",
    "build",
    "non-reproducible-wasm",
    "--locked",
    "--no-abi",
]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pinned to the versions the Shade Agent template uses (source of truth: R1).
near-sdk = "=5.26.1"
serde = { version = "=1.0.228", features = ["derive"] }
hex = { version = "=0.4.3", default-features = false, features = ["alloc"] }
# Added in P1.3 when agent registration / attestation is extended from the template:
# shade-attestation = "=0.2.0"

[dev-dependencies]
near-sdk = { version = "=5.26.1", features = ["unit-testing"] }
serde_json = "=1.0.149"
# Added in P1 for integration tests (sandbox), matching the template:
# near-api = "=0.8.6"
# near-api-types = "=0.8.6"
# near-sandbox = "=0.3.9"
# tokio = { version = "=1.52.1", features = ["full"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
