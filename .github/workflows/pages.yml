# Deploys the web app to GitHub Pages (free tier) on every push to main.
# One-time repository setting required: Settings → Pages → Source: "GitHub Actions".
#
# The app is a pure static build that reads the NEAR contract from the browser,
# so no server, secret, or paid service is involved. The contract id is baked
# in at build time below; the RPC defaults to fastnear (see web/src/near/config.ts).
name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # --base makes asset URLs resolve under /bona-fide/ (a GitHub Pages
      # project site is served from a sub-path, not the domain root).
      - run: npm run build -- --base=/bona-fide/
        working-directory: web
        env:
          VITE_CONTRACT_ID: bona-fide-rt2.testnet
      # Single-page-app fallback: GitHub Pages serves 404.html for unknown
      # paths, so deep links like /bona-fide/mandate/0 load the app.
      - run: cp web/dist/index.html web/dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
